<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TeamFirst Payback OG</title>
<!--
  링크 공유 미리보기(OG) 이미지 원본 템플릿 — app/opengraph-image.png 재생성용.
  재생성: 이 파일을 1200×630 뷰포트(Playwright/Chromium 등)로 열어 PNG 스크린샷 → app/opengraph-image.png 교체.
  요율(최대 12%)·문구 변경 시 함께 갱신할 것 (docs/DECISIONS.md D-072).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;800&display=swap">
<style>
  /* 로컬 렌더 시 Google Fonts(Noto Sans KR 500/800)를 링크하거나 Pretendard가 설치된 환경에서 연다. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; background: #111E38; color: #fff;
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(70% 70% at 15% 20%, rgba(37, 99, 235, 0.30), transparent 70%),
      radial-gradient(50% 55% at 90% 90%, rgba(2, 132, 199, 0.18), transparent 70%); }
  .wrap { position: relative; height: 100%; padding: 0 96px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .badge { width: 54px; height: 54px; border-radius: 14px; background: #fff; color: #111E38;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; letter-spacing: -1.5px;
    font-family: "Helvetica Neue", Arial, "Noto Sans KR", sans-serif; }
  .brand-name { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
  .h1 { margin-top: 44px; font-size: 96px; font-weight: 800; line-height: 1.12; letter-spacing: -3.5px; }
  .h1 .grad { background: linear-gradient(90deg, #ffffff 0%, #bae6fd 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 22px; font-size: 40px; font-weight: 500; line-height: 1.4; color: rgba(255,255,255,0.82); letter-spacing: -1px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="brand">
      <div class="badge">TF</div>
      <div class="brand-name">팀퍼스트</div>
    </div>
    <div class="h1">광고비 <span class="grad">최대 12%</span> 페이백</div>
    <div class="sub">+ 자동화 솔루션 3종 &nbsp;+ 전문가 컨설팅</div>
  </div>
</body>
</html>
