<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TeamFirst Payback OG</title>
<!--
  링크 공유 미리보기(OG) 이미지 원본 템플릿 — app/opengraph-image.png 재생성용.
  재생성: 이 파일을 1200×630 뷰포트(Playwright/Chromium 등)로 열어 PNG 스크린샷 → app/opengraph-image.png 교체.
  요율(10~12%)·문구 변경 시 함께 갱신할 것 (docs/DECISIONS.md D-072).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;800&display=swap">
<style>
  /* 로컬 렌더 시 Google Fonts(Noto Sans KR 500/800)를 링크하거나 Pretendard가 설치된 환경에서 연다. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; background: #111E38; color: #fff;
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(62% 60% at 50% -5%, rgba(37, 99, 235, 0.42), transparent 70%),
      radial-gradient(42% 44% at 88% 25%, rgba(2, 132, 199, 0.26), transparent 70%),
      radial-gradient(40% 40% at 5% 95%, rgba(56, 189, 248, 0.14), transparent 70%); }
  .grid { position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(75% 75% at 50% 35%, #000 25%, transparent 78%); }
  .wrap { position: relative; height: 100%; padding: 60px 76px 56px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .badge { width: 58px; height: 58px; border-radius: 15px; background: #fff; color: #111E38;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; letter-spacing: -1.5px;
    font-family: "Helvetica Neue", Arial, "Noto Sans KR", sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .brand-name { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .brand-name small { font-weight: 500; color: rgba(255,255,255,0.7); font-size: 24px; margin-left: 10px; }
  .pill { border: 1.5px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.08); border-radius: 999px;
    padding: 10px 22px; font-size: 20px; font-weight: 800; letter-spacing: 3px; color: rgba(255,255,255,0.9);
    font-family: "Helvetica Neue", Arial, "Noto Sans KR", sans-serif; }
  .hero { margin-top: 10px; }
  .h1 { font-size: 60px; font-weight: 800; line-height: 1.16; letter-spacing: -2px; }
  .h1 .big { display: block; font-size: 92px; line-height: 1.1; letter-spacing: -3.5px; margin-top: 6px; }
  .h1 .grad { background: linear-gradient(90deg, #ffffff 0%, #bae6fd 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 26px; font-size: 29px; font-weight: 500; line-height: 1.45; color: rgba(255,255,255,0.78); letter-spacing: -0.5px; }
  .chips { margin-top: 26px; display: flex; gap: 14px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 10px; border: 1.5px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07);
    border-radius: 999px; padding: 11px 22px 11px 18px; font-size: 25px; font-weight: 500; color: rgba(255,255,255,0.95); }
  .chip i { width: 12px; height: 12px; border-radius: 999px; background: #38bdf8; box-shadow: 0 0 0 4px rgba(56,189,248,0.22); }
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .url { font-size: 28px; font-weight: 800; color: #7dd3fc; letter-spacing: -0.5px; font-family: "Helvetica Neue", Arial, "Noto Sans KR", sans-serif; }
  .note { font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.62); letter-spacing: -0.3px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="badge">TF</div>
        <div class="brand-name">팀퍼스트 페이백<small>TeamFirst</small></div>
      </div>
      <div class="pill">TEAMFIRST PAYBACK</div>
    </div>

    <div class="hero">
      <div class="h1">
        대행권만 지정하면
        <span class="big">광고비 <span class="grad">10~12%</span> 페이백</span>
      </div>
      <div class="sub">운영 방식도, 계정 소유권도 그대로. 매체 대행수수료를 매월 현금으로 돌려드립니다.</div>
      <div class="chips">
        <div class="chip"><i></i>자체 솔루션 무료</div>
        <div class="chip"><i></i>카테고리 전문 마케터 월간 컨설팅</div>
        <div class="chip"><i></i>언제든 해지 가능</div>
      </div>
    </div>

    <div class="bottom">
      <div class="url">console.teamfirst.kr</div>
      <div class="note">네이버 광고 대행권 지정 한 번으로 시작</div>
    </div>
  </div>
</body>
</html>
